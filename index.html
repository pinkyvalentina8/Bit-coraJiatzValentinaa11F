<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Valentina Jiatz</title>
    <link rel="icon" href="Recursos/IMG/LOGO CAPU.png">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        header {
            padding: 20px;
            background-color: rgb(228, 149, 224);
        }
        h1 {
            text-shadow: 0 0 10px #ae73d1, 0 0 20px #b026ff, 0 0 30px #b026ff;
            color: white;
        }
        .semana {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-left: 5px solid #d895ff;
            max-width: 800px;
            text-align: left;
        }
        .logo-zoom {
            transition: transform 0.3s ease;
        }
        .logo-zoom:hover {
            transform: scale(1.1);
        }
        main {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            border-top: 1px solid rgb(93, 25, 108);
            background-color: rgb(180, 59, 142);
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bitácora segunda y tercera unidad</h1>
    </header>

    <main>
        <h1>Contenido de la página web</h1>

        <div class="semana">
            <h2>Semana 1</h2>
            <p>Documento de introducción:</p>
            <embed src="Introducción Arduino.pdf" type="application/pdf" width="100%" height="600px" />
        </div>

        <div class="semana">
            <h2>Semana 6</h2>
            <p>Video demostrativo del proyecto:</p>
            <video width="100%" controls style="border-radius: 10px; box-shadow: 0 0 15px rgba(216, 149, 255, 0.4);">
                <source src="recursos/img/pinky.mp4" type="video/mp4">
            </video>
        </div>
    </main>

    <footer>
        <span>@valen_jiatz</span>
        <img src="recursos/img/LOGO_CAPOUILLIEZ - Isotipos rojo.png" height="50" width="200" class="logo-zoom" alt="Logo Capouilliez">
    </footer>    
</body>
</html>
